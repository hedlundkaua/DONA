<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DONA Empreendedoras Restinga</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            plum: '#8a1c5b', // Cor ajustada conforme as diretrizes
                            navy: '#2d3748', // Cor escura para texto
                            pink: '#e93f78',
                            bg: '#f8f9fa',   // Fundo cinza bem claro
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Animação suave para troca de telas */
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 300ms ease-out, transform 300ms ease-out;
        }

        /* Ocultar scrollbar em inputs se necessário */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #2d3748 !important;
        }
    </style>
</head>
<body class="bg-brand-bg min-h-screen flex items-center justify-center p-4 text-brand-navy selection:bg-brand-pink selection:text-white">

    <!-- Container Principal (Card) -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 p-8 sm:p-10 overflow-hidden relative">
        
        <!-- Elemento de Mensagem (Substituto do alert) -->
        <div id="message-box" class="absolute top-0 left-0 right-0 p-3 text-center text-sm font-medium transition-transform duration-300 transform -translate-y-full z-10">
            <span id="message-text"></span>
        </div>

        <!-- Cabeçalho / Logo -->
        <div class="flex flex-col items-center justify-center mb-8">
            <img src="logo-do-site_2.jpg" alt="Logo Empreendedoras Restinga" class="logo w-32 h-32 object-contain mb-4">
            <h1 class="text-xl font-semibold text-brand-navy text-center">DONA - Empreendedoras Restinga</h1>
        </div>

        <!-- ================= TELA DE LOGIN ================= -->
        <div id="login-view" class="transition-all duration-300">
            <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@dona.com"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-pink/20 focus:border-brand-pink transition-colors placeholder-gray-400">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                        <button type="button" onclick="toggleView('forgot')" class="text-xs font-medium text-brand-pink hover:text-brand-plum transition-colors">
                            Esqueci a senha
                        </button>
                    </div>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-pink/20 focus:border-brand-pink transition-colors placeholder-gray-400">
                </div>

                <!-- Checkbox Lembrar de mim -->
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-brand-plum focus:ring-brand-plum border-gray-300 rounded cursor-pointer">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-700 cursor-pointer">
                        Lembrar de mim
                    </label>
                </div>

                <!-- reCAPTCHA Placeholder Visual -->
                <div class="flex items-center justify-between p-3 bg-gray-50 border border-gray-200 rounded-lg">
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" id="captcha-mock" class="h-6 w-6 text-blue-600 focus:ring-blue-500 border-gray-300 rounded shadow-inner cursor-pointer" required>
                        <label for="captcha-mock" class="text-sm font-medium text-gray-700 cursor-pointer">Não sou um robô</label>
                    </div>
                    <div class="flex flex-col items-center justify-center opacity-70">
                        <svg class="w-6 h-6 text-blue-500 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <span class="text-[9px] text-gray-500 tracking-wider">reCAPTCHA</span>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                        class="w-full bg-brand-plum text-white font-medium py-3 px-4 rounded-lg hover:bg-opacity-90 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-plum transition-all duration-200 flex justify-center items-center">
                        Entrar
                    </button>
                </div>
            </form>
        </div>

        <!-- ================= TELA DE ESQUECI A SENHA ================= -->
        <div id="forgot-view" class="hidden opacity-0 translate-y-2 transition-all duration-300">
            <div class="text-center mb-6">
                <h2 class="text-lg font-medium text-brand-navy mb-2">Recuperar senha</h2>
                <p class="text-sm text-gray-500 leading-relaxed">
                    Digite o e-mail associado à sua conta e enviaremos um link para redefinir sua senha.
                </p>
            </div>

            <form id="forgot-form" class="space-y-5" onsubmit="handleForgot(event)">
                <div>
                    <label for="reset-email" class="block text-sm font-medium text-gray-700 mb-1">E-mail cadastrado</label>
                    <input type="email" id="reset-email" name="reset-email" required placeholder="exemplo@dona.com"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-pink/20 focus:border-brand-pink transition-colors placeholder-gray-400">
                </div>

                <div class="pt-2 space-y-3">
                    <button type="submit" 
                        class="w-full bg-brand-plum text-white font-medium py-3 px-4 rounded-lg hover:bg-opacity-90 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-plum transition-all duration-200">
                        Enviar link de recuperação
                    </button>
                    
                    <button type="button" onclick="toggleView('login')" 
                        class="w-full bg-white text-brand-navy border border-gray-200 font-medium py-2.5 px-4 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200 transition-all duration-200">
                        Voltar ao login
                    </button>
                </div>
            </form>
        </div>

    </div>

    <script>
        // Elementos das views
        const loginView = document.getElementById('login-view');
        const forgotView = document.getElementById('forgot-view');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');

        // Função para alternar entre as telas com animação
        function toggleView(viewName) {
            if (viewName === 'forgot') {
                // Esconder Login
                loginView.style.opacity = '0';
                loginView.style.transform = 'translateY(-10px)';
                
                setTimeout(() => {
                    loginView.classList.add('hidden');
                    // Mostrar Forgot
                    forgotView.classList.remove('hidden');
                    // Forçar um reflow para a animação funcionar
                    void forgotView.offsetWidth; 
                    forgotView.classList.remove('opacity-0', 'translate-y-2');
                    forgotView.classList.add('opacity-100', 'translate-y-0');
                }, 200); // Tempo igual a transição (quase)

            } else if (viewName === 'login') {
                // Esconder Forgot
                forgotView.classList.remove('opacity-100', 'translate-y-0');
                forgotView.classList.add('opacity-0', 'translate-y-2');
                
                setTimeout(() => {
                    forgotView.classList.add('hidden');
                    // Mostrar Login
                    loginView.classList.remove('hidden');
                    void loginView.offsetWidth;
                    loginView.style.opacity = '1';
                    loginView.style.transform = 'translateY(0)';
                }, 200);
            }
        }

        // Sistema de mensagens UI (Substitui alert)
        function showMessage(msg, type = 'success') {
            messageText.textContent = msg;
            
            if (type === 'success') {
                messageBox.className = "absolute top-0 left-0 right-0 p-3 text-center text-sm font-medium transition-transform duration-300 transform translate-y-0 z-10 bg-green-100 text-green-800 border-b border-green-200";
            } else {
                messageBox.className = "absolute top-0 left-0 right-0 p-3 text-center text-sm font-medium transition-transform duration-300 transform translate-y-0 z-10 bg-red-100 text-red-800 border-b border-red-200";
            }

            // Ocultar após 3 segundos
            setTimeout(() => {
                messageBox.classList.remove('translate-y-0');
                messageBox.classList.add('-translate-y-full');
            }, 3000);
        }

        // Simulação de envio de formulários
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            // Lógica de autenticação viria aqui
            showMessage('Simulação: Entrando como ' + email + '...', 'success');
        }

        function handleForgot(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            // Lógica de envio de e-mail viria aqui
            showMessage('Simulação: Link de recuperação enviado para ' + email, 'success');
            
            // Voltar para login após sucesso simulado
            setTimeout(() => {
                toggleView('login');
                document.getElementById('forgot-form').reset();
            }, 2000);
        }
    </script>
</body>
</html>
